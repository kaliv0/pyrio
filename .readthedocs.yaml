version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.14"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv $READTHEDOCS_VIRTUALENV_PATH
    install:
      # Use a cache dir in the same mount to halve the install time
      # NB: Suppress the maximum version check of the underlying Rust build tools
      - |
        VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH \
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
        uv pip install \
          --cache-dir $READTHEDOCS_VIRTUALENV_PATH/../../uv_cache \
          -r docs/requirements.txt

sphinx:
  configuration: docs/conf.py
